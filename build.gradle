plugins {
    id 'com.gradleup.shadow' version '8.3.1'
    id 'java'
}

group = 'it.pintux'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://s01.oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "CodeMC"
        url = uri("https://repo.codemc.io/repository/maven-public/")
    }
    maven {
        name = 'PAPI'
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven { url = "https://maven.enginehub.org/repo/" }
    maven {
        name = 'JitPack.io'
        url = 'https://jitpack.io'
    }
    maven { url 'https://repo.william278.net/releases' }
    maven {
        name = 'Lumine'
        url = 'https://mvn.lumine.io/repository/maven-public/'
    }
    maven {
        name = 'Citizens'
        url = 'https://maven.citizensnpcs.co/repo'
    }
    maven {
        name = 'Lands'
        url = 'https://repo.landsgame.net/releases'
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT")
    compileOnly 'me.clip:placeholderapi:2.11.6'
    implementation 'de.tr7zw:item-nbt-api:2.15.7'
    implementation 'com.zaxxer:HikariCP:6.2.1'
    compileOnly 'com.github.GriefPrevention:GriefPrevention:17.0.0'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'
    compileOnly 'net.william278.huskclaims:huskclaims-bukkit:1.4'
    compileOnly "com.github.angeschossen:LandsAPI:7.9.16"
    compileOnly('io.lumine:Mythic-Dist:5.6.1') {
        exclude group: '*'
    }
    compileOnly('net.citizensnpcs:citizens-main:2.0.42-SNAPSHOT') {
        exclude group: '*'
    }
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    relocate("de.tr7zw.changeme.nbtapi", "it.pintux.life.nbtapi")
    minimize()
    archiveClassifier = null
    destinationDirectory.set("C:\\Users\\pintu\\Desktop\\Server\\Java-Bedrock-Server\\lobby\\plugins" as File)
}
