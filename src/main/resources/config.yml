database:
  type: mysql
  mysql:
    host: localhost
    port: 3306
    database: entitycatcher
    username: root
    password: password123

exclusions:
  mythicmobs:
    # Set to true to prevent capture of specific MythicMobs types
    # Use "*" to deny ALL MythicMobs
    AncientDragon: true
    SkeletonKing: true
    CustomZombieBoss: true

  # Catcher types that bypass the MythicMobs/Citizens exclusion
  bypass_catchers:
    - BossCatcher

  # Worlds where catching is completely disabled
  disabled_worlds:
    - world_nether
    - world_the_end

catchers:
  AnimalCatcher:
    display_name: "Animal Catcher"
    description:
      empty:
        material: STICK
        lore:
          - "&7Empty.. go catch something"
      captured:
        material: BLAZE_ROD
        lore:
          - "&7Entity: &f{name}"
          - "&7Type: &f{type}"
          - "&7Age: &f{age}"
          - "&7Variant: &f{variant}"
    recipe:
      shape:
        - " A "
        - " B "
        - " C "
      ingredients:
        A: "IRON_INGOT"
        B: "BUCKET"
        C: "LEATHER"
    capture:
      allowed_types: "ANIMAL"
      capture_chance: 1.0
      permissions:
        capture: "entitycatcher.capture"
        place: "entitycatcher.place"
    capture_data:
      capture_custom_name: true
      capture_health: true
      capture_variant: true
      capture_armor: true
      capture_equipment: true
    place_behavior:
      remove_ai: false
      set_invisible: false
      set_glowing: false
      set_on_fire: false
      set_invincible: false

  MobCatcher:
    display_name: "Mob Catcher"
    description:
      empty:
        material: STICK
        lore:
          - "&7Empty.. go catch something"
      captured:
        material: BLAZE_ROD
        lore:
          - "&7Entity: &f{name}"
          - "&7Type: &f{type}"
          - "&7Age: &f{age}"
          - "&7Variant: &f{variant}"
    recipe:
      shape:
        - " A "
        - " B "
        - " C "
      ingredients:
        A: "IRON_INGOT"
        B: "BUCKET"
        C: "STRING"
    capture:
      allowed_types: "MOB"
      capture_chance: 1.0
      permissions:
        capture: "entitycatcher.capture"
        place: "entitycatcher.place"
    capture_data:
      capture_custom_name: true
      capture_health: true
      capture_variant: false
      capture_armor: false
      capture_equipment: true
    place_behavior:
      remove_ai: false
      set_invisible: false
      set_glowing: false
      set_on_fire: false
      set_invincible: false

  NoAICatcher:
    display_name: "No AI Catcher"
    description:
      empty:
        material: STICK
        lore:
          - "&7Empty.. go catch something"
      captured:
        material: BLAZE_ROD
        lore:
          - "&7Entity: &f{name}"
          - "&7Type: &f{type}"
          - "&7Age: &f{age}"
          - "&7Variant: &f{variant}"
    recipe:
      shape:
        - " A "
        - " B "
        - " C "
      ingredients:
        A: "GOLD_INGOT"
        B: "BUCKET"
        C: "REDSTONE"
    capture:
      allowed_types: "ANYTHING"
      capture_chance: 1.0
      permissions:
        capture: "entitycatcher.capture"
        place: "entitycatcher.place"
    capture_data:
      capture_custom_name: true
      capture_health: true
      capture_variant: false
      capture_armor: false
      capture_equipment: false
    place_behavior:
      remove_ai: true
      set_invisible: false
      set_glowing: true
      set_on_fire: false
      set_invincible: false

  BossCatcher:
    display_name: "&6&lBoss Catcher"
    description:
      empty:
        material: NETHER_STAR
        lore:
          - "&e&lA powerful catcher"
          - "&7Can capture &6bosses &7and denylisted mobs"
      captured:
        material: NETHER_STAR
        lore:
          - "&7Entity: &f{name}"
          - "&7Type: &f{type}"
          - "&7Age: &f{age}"
          - "&7Variant: &f{variant}"
    recipe:
      shape:
        - "ABA"
        - "BCB"
        - "ABA"
      ingredients:
        A: "NETHERITE_INGOT"
        B: "END_CRYSTAL"
        C: "BUCKET"
    capture:
      allowed_types: "ANYTHING"
      capture_chance: 0.25
      permissions:
        capture: "entitycatcher.boss.capture"
        place: "entitycatcher.boss.place"
    capture_data:
      capture_custom_name: true
      capture_health: true
      capture_variant: true
      capture_armor: true
      capture_equipment: true
    place_behavior:
      remove_ai: false
      set_invisible: false
      set_glowing: false
      set_on_fire: false
      set_invincible: false
